services:
  restruo:
    image: ghcr.io/jwapps-app/restruo:latest
    # build: .                # uncomment to build from source instead
    container_name: restruo
    ports:
      - "${RESTRUO_PORT:-8080}:8080"
    volumes:
      # Holds the instance list added via the settings UI (and their credentials).
      # Swap for a bind mount (/some/host/path:/data) to keep it on a share.
      - restruo-data:/data
      # Optional: mount a config file to override defaults (see config.example.yaml)
      # - ./config.yaml:/config/config.yaml:ro
    # Every supported setting is passed through. Set them in a .env file next
    # to this one (see .env.example) or in the shell; an unset or empty one
    # leaves Restruo at its default.
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env or the stack environment}
      RESTRUO_USERNAME: ${RESTRUO_USERNAME:-}
      RESTRUO_TITLE: ${RESTRUO_TITLE:-}
      RESTRUO_FLOATING_TAGS: ${RESTRUO_FLOATING_TAGS:-}
      RESTRUO_REFRESH_SECONDS: ${RESTRUO_REFRESH_SECONDS:-}
      RESTRUO_SMTP_USER: ${RESTRUO_SMTP_USER:-}
      RESTRUO_SMTP_PASSWORD: ${RESTRUO_SMTP_PASSWORD:-}
      RESTRUO_SMTP_HOST: ${RESTRUO_SMTP_HOST:-}
      RESTRUO_SMTP_PORT: ${RESTRUO_SMTP_PORT:-}
      RESTRUO_SMTP_SECURITY: ${RESTRUO_SMTP_SECURITY:-}
      RESTRUO_EMAIL_TO: ${RESTRUO_EMAIL_TO:-}
      RESTRUO_EMAIL_FROM: ${RESTRUO_EMAIL_FROM:-}
      RESTRUO_REGISTRY_AUTH: ${RESTRUO_REGISTRY_AUTH:-}
      RESTRUO_HELPER_IMAGE: ${RESTRUO_HELPER_IMAGE:-}
    restart: unless-stopped

volumes:
  restruo-data:
