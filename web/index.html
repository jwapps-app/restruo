<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restruo</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0086c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restruo">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --border: #e2e5ea; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #16a34a; --err: #dc2626; --warn: #d97706; --badge-bg: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b93a1;
      --border: #262c35; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #22c55e; --err: #ef4444; --warn: #f59e0b; --badge-bg: #1f2630;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  #home {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    border-radius: 8px; padding: 2px 6px; margin: -2px -6px;
  }
  #home:hover { background: var(--bg); }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  #search {
    flex: 1; min-width: 160px; max-width: 340px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  button {
    font: inherit; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .55; cursor: default; }
  main { padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }
  .instance {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 16px; overflow: hidden;
  }
  .instance-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    cursor: pointer; user-select: none; flex-wrap: wrap;
  }
  .instance-header h2 { font-size: 15px; margin: 0; flex: 1; }
  .caret { transition: transform .15s; color: var(--muted); }
  .collapsed .caret { transform: rotate(-90deg); }
  .collapsed .stack-body { display: none; }
  .badge {
    font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--badge-bg);
  }
  .badge.ok { color: var(--ok); }
  .badge.err { color: var(--err); }
  .badge.upd { color: var(--accent); font-weight: 600; }
  .badge.unk { color: var(--warn); cursor: pointer; }
  #modal-text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
  .update-btn.has-upd, .update-all-btn.has-upd {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-text); font-weight: 600;
  }
  .update-btn:disabled, .power-btn:disabled { opacity: .45; cursor: not-allowed; }
  .power-btn { margin-left: 6px; padding: 7px 10px; }
  .power-btn.start { color: var(--ok); border-color: var(--ok); }
  .count { color: var(--muted); font-size: 13px; }
  .img-line { display: block; }
  .img-line.upd { color: var(--accent); font-weight: 600; }
  .img-line.unk { cursor: help; }
  .img-note { color: var(--muted); font-weight: 400; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--border); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.images { color: var(--muted); font-size: 13px; max-width: 320px; overflow-wrap: anywhere; }
  td.when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .type-tag { font-size: 12px; background: var(--badge-bg); border-radius: 6px; padding: 2px 7px; }
  .env-tag {
    font-size: 12px; color: var(--muted); background: var(--badge-bg);
    border-radius: 6px; padding: 2px 7px; font-weight: 400; margin-left: 6px;
  }
  .unreachable-note { padding: 12px 16px; color: var(--err); border-top: 1px solid var(--border); font-size: 14px; }
  .result-msg { font-size: 12px; display: block; margin-top: 4px; max-width: 260px; overflow-wrap: anywhere; }
  .result-msg.ok { color: var(--ok); }
  .result-msg.err { color: var(--err); }
  .greyed { opacity: .45; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; margin-right: 6px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-line { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  /* login */
  #view-login { display: flex; justify-content: center; padding-top: 10vh; }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px 28px; width: min(340px, 92vw); text-align: center;
  }
  .login-card img { border-radius: 13px; margin-bottom: 10px; }
  .login-card h2 { margin: 0 0 20px; font-size: 20px; }
  .login-card input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; font: inherit;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  .login-card button { width: 100%; padding: 10px; margin-top: 4px; }
  #login-msg { font-size: 13px; color: var(--err); min-height: 18px; margin: 10px 0 0; }
  /* settings */
  .settings-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .settings-panel h2 { font-size: 16px; margin: 0 0 12px; }
  .settings-panel h3 { font-size: 14px; margin: 20px 0 10px; }
  .inst-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .inst-row:first-child { border-top: none; }
  .inst-row .inst-name { font-weight: 600; }
  .inst-move {
    padding: 2px 8px; font-size: 12px; line-height: 1.4; min-width: 26px;
  }
  .inst-order { display: flex; flex-direction: column; gap: 2px; }
  #build-line { color: var(--muted); font-size: 12px; }
  .inst-row .inst-url { color: var(--muted); font-size: 13px; flex: 1; overflow-wrap: anywhere; }
  #inst-form label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  #inst-form input[type="text"], #inst-form input[type="url"],
  #inst-form input[type="password"] {
    width: 100%; max-width: 440px; padding: 7px 10px; font: inherit;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  #inst-form .check, #inst-form .radio {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text); margin-right: 16px; font-size: 14px;
  }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  #form-msg { font-size: 13px; margin: 10px 0 0; }
  #form-msg.ok { color: var(--ok); }
  #form-msg.err { color: var(--err); }
  #email-msg { font-size: 13px; margin: 10px 0 0; }
  #email-msg.ok { color: var(--ok); }
  #email-msg.err { color: var(--err); }
  /* modal */
  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; width: min(420px, 90vw);
  }
  #modal h3 { margin: 0 0 8px; font-size: 16px; }
  #modal p { margin: 0 0 18px; color: var(--muted); }
  #modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
  #modal-extra:not(:empty) { margin: -6px 0 18px; }
  #modal-extra .chk { display: flex; gap: 8px; align-items: baseline; margin: 8px 0; font-size: 14px; }
  #modal-extra .danger { color: var(--err); }
  @media (max-width: 640px) {
    th.hide-sm, td.hide-sm { display: none; }
    main { padding: 12px 8px 60px; }
    th, td { padding: 8px 8px; }
    td:first-child { overflow-wrap: anywhere; }
    td:last-child { white-space: nowrap; }
    .update-btn, .update-all-btn, .cleanup-btn { padding: 6px 10px; }
    header { padding: 10px 12px; gap: 8px; }
    .instance-header { padding: 10px 12px; gap: 8px; }
    .result-msg { max-width: 140px; white-space: normal; }
  }
</style>
</head>
<body>
<header>
  <div id="home" title="Back to dashboard">
    <img src="/icon.svg" alt="" width="26" height="26" style="border-radius:6px">
    <h1 id="title">Restruo <span>Portainer stack updater</span></h1>
  </div>
  <input id="search" type="search" placeholder="Filter stacks…">
  <button id="settings-btn" title="Manage Portainer instances">⚙ Instances</button>
  <button id="refresh" class="primary" title="Reload stacks and scan registries for updates">Refresh</button>
</header>
<main>
  <div id="view-login" style="display:none">
    <div class="login-card">
      <img src="/icon.svg" width="56" height="56" alt="">
      <h2 id="login-title">Restruo</h2>
      <form id="login-form">
        <input id="l-user" type="text" placeholder="Username" aria-label="Username" autocomplete="username" required>
        <input id="l-pass" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
        <button class="primary" type="submit" id="l-submit">Sign in</button>
        <p id="login-msg"></p>
      </form>
    </div>
  </div>
  <div id="view-dashboard">
    <p id="status-line"><span id="status-stacks">Loading…</span> <span id="status-updates"></span></p>
    <div id="instances"></div>
  </div>
  <div id="view-settings" style="display:none">
    <div class="settings-panel">
      <h2>Portainer instances</h2>
      <div id="inst-list"><p class="count">Loading…</p></div>
      <h3 id="form-title">Add an instance</h3>
      <form id="inst-form" autocomplete="off">
        <label for="f-name">Name</label>
        <input type="text" id="f-name" required placeholder="NAS (prod)">
        <label for="f-url">Portainer URL</label>
        <input type="url" id="f-url" required placeholder="https://192.168.1.20:9443">
        <label style="margin-top:12px">Authentication</label>
        <span class="radio"><input type="radio" name="authType" id="f-auth-key" value="api_key" checked> API token</span>
        <span class="radio"><input type="radio" name="authType" id="f-auth-cred" value="credentials"> Username &amp; password</span>
        <div id="auth-key-fields">
          <label for="f-apikey">API token <span id="apikey-hint"></span></label>
          <input type="password" id="f-apikey" placeholder="ptr_…">
        </div>
        <div id="auth-cred-fields" style="display:none">
          <label for="f-username">Username</label>
          <input type="text" id="f-username" placeholder="admin">
          <label for="f-password">Password <span id="password-hint"></span></label>
          <input type="password" id="f-password">
        </div>
        <label class="check" style="margin-top:12px"><input type="checkbox" id="f-verify" checked> Verify TLS certificate (uncheck only for a self-signed certificate)</label>
        <div class="form-actions">
          <button type="button" id="f-test">Test connection</button>
          <button type="submit" class="primary" id="f-save">Add instance</button>
          <button type="button" id="f-cancel" style="display:none">Cancel edit</button>
        </div>
        <p id="form-msg"></p>
      </form>
    </div>
    <div class="settings-panel" id="email-panel" style="display:none">
      <h2>Update notifications</h2>
      <p id="email-status" class="count"></p>
      <div class="form-actions">
        <button type="button" id="email-test">Send test email</button>
      </div>
      <p id="email-msg"></p>
    </div>
    <div style="display:flex; gap:10px; align-items:center; justify-content:space-between;">
      <button id="settings-close">← Back to dashboard</button>
      <span id="build-line"></span>
      <button id="signout-btn" style="display:none">Sign out</button>
    </div>
  </div>
</main>

<div id="modal-backdrop">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div id="modal-extra"></div>
    <div class="actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="primary">Update</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // --- state -----------------------------------------------------------------
  // Everything on screen is drawn from these by render(). Nothing is read back
  // out of the page, and nothing is patched into it after the fact.
  let data = [];                                          // GET /api/stacks
  let updates = { checkedAt: null, instances: [] };       // GET /api/updates
  const expanded = new Set();  // instances start collapsed; user opens what they need
  // What each button is doing right now, by row key (or "<iid>:prune",
  // "<iid>:all" for an instance's own buttons):
  //   { action, phase: "busy" | "ok" | "err" | "settled", label, message }
  // "settled" keeps a result message on its row until the next refresh.
  const ops = new Map();

  const $ = (sel, el = document) => el.querySelector(sel);

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // The outcome of an update check, as app/updates.py names them.
  const STATUS = {
    UPDATE: "update-available", CURRENT: "up-to-date", PINNED: "pinned",
    UNKNOWN: "unknown", LOCAL: "local", PRIVATE: "private", NOT_DEPLOYED: "not-deployed",
  };

  // How many redeploys "Update all" runs at once. Portainer handles separate
  // stacks in parallel; the cap is about not saturating the host's disk and
  // network with simultaneous image pulls.
  const UPDATE_ALL_CONCURRENCY = 4;
  const SPINNER = '<span class="spinner"></span>';

  // --- talking to the server -------------------------------------------------

  class ApiError extends Error {
    constructor(message, status) { super(message); this.status = status; }
  }

  function errorText(body, status) {
    const said = body && (body.message || body.detail);
    if (Array.isArray(said)) return said.map((d) => d.msg || String(d)).join("; ");
    return said || `HTTP ${status}`;
  }

  // Every call to our own API goes through here. It carries the X-Restruo
  // header — the server refuses a cookie-authenticated change without it,
  // which is what stops a page on another port of this host from riding the
  // session cookie. It resolves to the parsed body, and rejects with an
  // ApiError carrying the server's own words for anything else; being signed
  // out shows the login screen. A network failure rejects as fetch does (a
  // TypeError), so callers can tell "the server said no" from "no server".
  async function api(path, { method = "GET", body, expectSignedOut = false } = {}) {
    const init = { method, headers: { "X-Restruo": "1" } };
    if (body !== undefined) {
      init.headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(body);
    }
    const res = await fetch(path, init);
    const parsed = await res.json().catch(() => ({}));
    if (res.ok) return parsed;
    if (res.status === 401 && !expectSignedOut) showLogin(true);
    throw new ApiError(errorText(parsed, res.status), res.status);
  }

  // --- small formatters ------------------------------------------------------

  function fmtWhen(ts) {
    if (!ts) return "—";
    const ms = ts > 1e12 ? ts : ts * 1000;
    return new Date(ms).toLocaleString(undefined,
      { dateStyle: "medium", timeStyle: "short" });
  }

  function ago(ts) {
    const mins = Math.round((Date.now() / 1000 - ts) / 60);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    return `${Math.round(mins / 60)}h ago`;
  }

  function fmtBytes(bytes) {
    if (!bytes) return "0 B";
    const units = ["B", "KB", "MB", "GB", "TB"];
    const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
    return `${(bytes / 1024 ** i).toFixed(i ? 1 : 0)} ${units[i]}`;
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  // --- rows ------------------------------------------------------------------
  // One entry per stack or container: the row the server sent, joined with
  // what the last update check said about it. Rendering, the click handler
  // and "Update all" all work from these.

  function updateInfoFor(iid, sid) {
    const inst = updates.instances.find((u) => u.instance.id === iid);
    return inst ? inst.stacks.find((s) => s.id === sid) : null;
  }

  // Container ids are unique per host, not per Portainer — machines cloned from
  // a template share them. Match on the environment too, or every clone shows
  // whichever host was listed first.
  function updateInfoForCtr(iid, cid, eid) {
    const inst = updates.instances.find((u) => u.instance.id === iid);
    if (!inst) return null;
    const list = inst.containers || [];
    return list.find((c) => c.id === cid && (eid == null || c.endpointId === eid))
      || (eid == null ? list.find((c) => c.id === cid) : null);
  }

  function entriesOf(inst) {
    const iid = inst.instance.id;
    const stacks = inst.stacks.map((s) => {
      const info = updateInfoFor(iid, s.id);
      const checked = (info && info.images) || [];
      return {
        kind: "stack", key: `${iid}:s:${s.id}`, iid, name: s.name, row: s,
        images: s.images, checked,
        updates: (info && info.updatesAvailable) || 0,
        unknown: checked.filter((i) => i.status === STATUS.UNKNOWN),
        down: s.stopped ? 1 : (s.downNames || []).length,
        path: `/api/instances/${iid}/stacks/${s.id}`, query: "",
      };
    });
    const containers = (inst.containers || []).map((c) => {
      const info = updateInfoForCtr(iid, c.id, c.endpointId);
      const checked = info
        ? [{ image: c.image, status: info.status, detail: info.detail, rebuild: info.rebuild }] : [];
      return {
        kind: "container", key: `${iid}:c:${c.endpointId ?? ""}:${c.id}`, iid, name: c.name, row: c,
        images: [c.image], checked,
        updates: info && info.status === STATUS.UPDATE ? 1 : 0,
        unknown: checked.filter((i) => i.status === STATUS.UNKNOWN),
        down: c.down ? 1 : 0,
        path: `/api/instances/${iid}/containers/${c.id}`,
        query: c.endpointId == null ? "" : `?endpointId=${c.endpointId}`,
      };
    });
    return [...stacks, ...containers];
  }

  function findEntry(key) {
    for (const inst of data) {
      const entry = entriesOf(inst).find((e) => e.key === key);
      if (entry) return entry;
    }
    return null;
  }

  const currentFilter = () => $("#search").value.trim().toLowerCase();

  function matches(entry, filter) {
    return !filter || entry.name.toLowerCase().includes(filter) ||
      (entry.row.environment || "").toLowerCase().includes(filter) ||
      entry.images.some((i) => i.toLowerCase().includes(filter));
  }

  // The op showing on a row's buttons, if any. A settled one only leaves its message.
  const activeOp = (key, action) => {
    const op = ops.get(key);
    return op && op.action === action && op.phase !== "settled" ? op : null;
  };
  const isBusy = (key) => (ops.get(key) || {}).phase === "busy";
  const anyBusy = () => [...ops.values()].some((op) => op.phase === "busy");

  function setOp(key, op) {
    ops.set(key, op);
    render();
    return op;
  }

  // After a few seconds the button goes back to normal; the message stays.
  function settleLater(key, op) {
    setTimeout(() => {
      if (ops.get(key) !== op) return;
      op.phase = "settled";
      render();
    }, 4000);
  }

  // --- drawing ---------------------------------------------------------------

  function imgLine(img) {
    if (img.status === STATUS.UPDATE)
      return `<span class="img-line upd" title="${esc(img.detail || "A newer image is available from the registry")}">⬆ ${esc(img.image)} <span class="img-note">${img.rebuild ? "new build" : "new version"}</span></span>`;
    if (img.status === STATUS.PINNED)
      return `<span class="img-line" title="${esc(img.detail || "Pinned to a specific version — not checked")}">${esc(img.image)} <span class="img-note">pinned</span></span>`;
    if (img.status === STATUS.CURRENT)
      return `<span class="img-line" title="Up to date with the registry">${esc(img.image)}</span>`;
    if (img.status === STATUS.LOCAL)
      return `<span class="img-line" title="${esc(img.detail || "Not from a registry")}">${esc(img.image)} <span class="img-note">local</span></span>`;
    if (img.status === STATUS.PRIVATE)
      return `<span class="img-line unk" title="${esc(img.detail || "Private registry")}">${esc(img.image)} <span class="img-note">private</span></span>`;
    if (img.status === STATUS.NOT_DEPLOYED)
      return `<span class="img-line" title="${esc(img.detail || "Declared in the stack file but not running")}">${esc(img.image)} <span class="img-note">not deployed</span></span>`;
    return `<span class="img-line unk" title="${esc(img.detail || "Could not check")}">${esc(img.image)} <span class="img-note">?</span></span>`;
  }

  function updateButton(e) {
    // The server says which rows it will refuse; see app/dashboard.py.
    if (e.row.updateProtected)
      return '<button class="update-btn" disabled title="This stack runs Portainer or a Portainer agent — redeploying it would stop the container carrying the command, so it could never finish. Update it from that host.">Update</button>';
    const op = activeOp(e.key, "update");
    const label = !op ? (e.updates ? "⬆ Update" : "Update")
      : op.phase === "busy" ? SPINNER + esc(op.label)
      : op.phase === "ok" ? "✅ Updated" : "❌ Failed";
    const title = e.row.helper
      ? ' title="Replaced by a short-lived helper the Docker daemon runs — Portainer can\'t recreate this one itself"' : "";
    return `<button class="update-btn${e.updates ? " has-upd" : ""}" data-act="update"
      data-key="${esc(e.key)}" data-fk="${esc(e.key)}|update"${op || isBusy(e.key) ? " disabled" : ""}${title}>${label}</button>`;
  }

  function powerButton(e) {
    const word = e.row.running ? "Stop" : "Start";
    // Stopping Portainer (or Restruo) through Portainer's own API would kill
    // the connection needed to start it again — the server refuses it too.
    if (e.row.selfCritical)
      return `<button class="power-btn" disabled title="Can't be stopped from here — it's what Restruo talks to">${word}</button>`;
    const op = activeOp(e.key, "power");
    const label = !op ? word
      : op.phase === "busy" ? SPINNER + (op.verb === "stop" ? "Stopping…" : "Starting…")
      : op.phase === "ok" ? "✅ Done" : "❌ Failed";
    return `<button class="power-btn${e.row.running ? "" : " start"}" data-act="${e.row.running ? "stop" : "start"}"
      data-key="${esc(e.key)}" data-fk="${esc(e.key)}|power"${op || isBusy(e.key) ? " disabled" : ""}>${label}</button>`;
  }

  function resultMessage(e) {
    const op = ops.get(e.key);
    if (!op || !op.message) return '<span class="result-msg"></span>';
    const tone = op.phase === "busy" ? "" : op.ok ? " ok" : " err";
    return `<span class="result-msg${tone}">${esc(op.message)}</span>`;
  }

  // An image whose check failed (usually an environment we couldn't reach) is
  // neither down nor out of date — but it IS unmonitored, and the Images
  // column that says so is hidden on phones. "local" and "private" are
  // inherent properties, not failures — only checks that actually broke count.
  function unknownBadge(e) {
    if (!e.unknown.length) return "";
    const why = e.unknown.map((i) => `${i.image}: ${i.detail || "could not check"}`).join("\n");
    return ` <span class="badge unk" title="${esc(why)}">? unchecked</span>`;
  }

  function rowHtml(e, multiEnv) {
    const r = e.row;
    const isStack = e.kind === "stack";
    const envTag = multiEnv && r.environment
      ? ` <span class="env-tag" title="Portainer environment">${esc(r.environment)}</span>` : "";
    let downBadge = "";
    if (isStack && r.stopped) downBadge = ' <span class="badge err">● stopped</span>';
    else if (isStack && r.downNames && r.downNames.length)
      downBadge = ` <span class="badge err" title="${esc(r.downNames.join(", "))}">● ${r.downNames.length} down</span>`;
    else if (!isStack && r.down)
      downBadge = ` <span class="badge err" title="${esc(r.statusText || r.state)}">● down</span>`;
    const updBadge = !e.updates ? ""
      : isStack ? ` <span class="badge upd">⬆ ${plural(e.updates, "update")}</span>`
      : ' <span class="badge upd">⬆ update</span>';
    const images = e.checked.length ? e.checked.map(imgLine).join("")
      : esc(e.images.join(", ") || "—");
    const type = isStack ? esc(r.git ? r.type + " · git" : r.type) : "container";
    const when = isStack
      ? `<td class="when hide-sm">${fmtWhen(r.updatedAt)}</td>`
      : `<td class="when hide-sm"${r.down ? ' style="color:var(--err)"' : ""}>${esc(r.state)}</td>`;
    return `
          <tr>
            <td><strong>${esc(e.name)}</strong>${envTag}${downBadge}${updBadge}${unknownBadge(e)}</td>
            <td class="hide-sm"><span class="type-tag">${type}</span></td>
            <td class="images hide-sm">${images}</td>
            ${when}
            <td>
              ${updateButton(e)}
              ${powerButton(e)}
              ${resultMessage(e)}
            </td>
          </tr>`;
  }

  function render() {
    const filter = currentFilter();
    const root = $("#instances");
    // Redrawing replaces every button; put the keyboard back where it was.
    const focusKey = document.activeElement && root.contains(document.activeElement)
      ? document.activeElement.dataset.fk : null;
    root.innerHTML = "";
    // Always by name: the environment is a label, not a grouping — a list
    // that isn't strictly A–Z is hard to scan.
    const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" });

    for (const inst of data) {
      const iid = inst.instance.id;
      // Only worth labelling when this Portainer manages more than one.
      const multiEnv = (inst.environments || 1) > 1;
      const all = entriesOf(inst);
      // One combined A–Z list — stacks and containers interleaved.
      const shown = all.filter((e) => matches(e, filter)).sort(byName);
      if (filter && shown.length === 0 && inst.reachable) continue;

      const open = !!(filter || expanded.has(iid));
      const section = document.createElement("section");
      section.className = "instance" + (open ? "" : " collapsed") + (inst.reachable ? "" : " greyed");
      const badge = inst.reachable
        ? '<span class="badge ok">● reachable</span>'
        : `<span class="badge err" title="${esc(inst.error)}">● unreachable</span>`;

      const envErrors = Object.entries(inst.environmentErrors || {});
      const envNote = envErrors.length
        ? `<div class="stack-body unreachable-note">Could not read ${envErrors.length === 1 ? "an environment" : envErrors.length + " environments"} — what is shown for ${esc(envErrors.map(([n]) => n).join(", "))} is incomplete, not fine. ${esc(envErrors[0][1])}</div>`
        : "";
      let body;
      if (!inst.reachable) {
        body = `<div class="stack-body unreachable-note">${esc(inst.error)}</div>`;
      } else if (shown.length === 0) {
        body = '<div class="stack-body unreachable-note" style="color:var(--muted)">No stacks or standalone containers.</div>';
      } else {
        body = `<div class="stack-body"><table>
          <thead><tr><th>Stack / container</th><th class="hide-sm">Type</th><th class="hide-sm">Images</th>
          <th class="hide-sm">Updated</th><th></th></tr></thead>
          <tbody>${shown.map((e) => rowHtml(e, multiEnv)).join("")}</tbody></table></div>`;
      }

      // Counted from the rows that exist, not straight from the cached check:
      // an entry for a stack that has since been recreated (new id), or for a
      // container on an environment that didn't enumerate this round, has no
      // row able to show it.
      const updCount = all.reduce((n, e) => n + e.updates, 0);
      const downCount = all.reduce((n, e) => n + e.down, 0);
      const unchecked = all.filter((e) => e.unknown.length);
      const unknownReasons = unchecked.flatMap((e) =>
        e.unknown.map((i) => `${e.name} — ${i.image}: ${i.detail || "could not check"}`));
      const ctrCount = (inst.containers || []).length;
      const cleaning = ops.has(`${iid}:prune`);
      const updatingAll = ops.has(`${iid}:all`);
      section.innerHTML = `
        <div class="instance-header" role="button" tabindex="0" data-fk="${esc(String(iid))}|header" aria-expanded="${open}" aria-label="${esc(inst.instance.name)}: ${open ? "collapse" : "expand"}">
          <span class="caret" aria-hidden="true">▼</span>
          <h2>${esc(inst.instance.name)}</h2>
          <span class="count">${plural(inst.stacks.length, "stack")}${ctrCount ? ` · ${plural(ctrCount, "container")}` : ""}</span>
          ${downCount ? `<span class="badge err">● ${downCount} down</span>` : ""}
          ${updCount ? `<span class="badge upd">⬆ ${plural(updCount, "update")}</span>` : ""}
          ${unchecked.length ? `<span class="badge unk" title="${esc(unknownReasons.slice(0, 40).join("\n"))}">? ${unchecked.length} unchecked</span>` : ""}
          ${badge}
          ${inst.reachable ? `<button class="cleanup-btn" data-act="cleanup" data-iid="${esc(String(iid))}" data-fk="${esc(String(iid))}|cleanup" title="Remove unused images, networks, and optionally volumes"${cleaning ? " disabled" : ""}>${cleaning ? SPINNER + "Cleaning…" : "Clean up"}</button>` : ""}
          ${inst.reachable && all.length ?
            `<button class="update-all-btn${updCount ? " has-upd" : ""}" data-act="update-all" data-iid="${esc(String(iid))}" data-fk="${esc(String(iid))}|all"${updatingAll ? " disabled" : ""}>${updatingAll ? SPINNER + "Updating…" : updCount ? "⬆ Update all" : "Update all"}</button>` : ""}
        </div>${envNote}${body}`;

      const header = $(".instance-header", section);
      const toggle = (ev) => {
        if (ev.target.closest("button")) return;
        expanded.has(iid) ? expanded.delete(iid) : expanded.add(iid);
        section.classList.toggle("collapsed");
        header.setAttribute("aria-expanded", String(!section.classList.contains("collapsed")));
      };
      header.addEventListener("click", toggle);
      header.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(ev); }
      });
      root.appendChild(section);
    }
    if (focusKey) {
      const again = [...root.querySelectorAll("[data-fk]")].find((el) => el.dataset.fk === focusKey);
      if (again && !again.disabled) again.focus();
    }
  }

  // Modals are queued: several instances can finish a cleanup at once, and a
  // second dialog must not overwrite one still on screen (which would lose its
  // result). opts.extraHtml renders inside the dialog and its checkbox states
  // come back on the resolved value.
  let modalChain = Promise.resolve();

  function confirmModal(title, text, opts = {}) {
    const show = () => new Promise((resolve) => {
      $("#modal-title").textContent = title;
      $("#modal-text").textContent = text;
      $("#modal-extra").innerHTML = opts.extraHtml || "";
      $("#modal-confirm").textContent = opts.okText || "Update";
      $("#modal-cancel").style.display = opts.okOnly ? "none" : "";
      const backdrop = $("#modal-backdrop");
      const opener = document.activeElement;
      backdrop.classList.add("open");
      const onKey = (e) => { if (e.key === "Escape") done(false); };
      document.addEventListener("keydown", onKey);
      setTimeout(() => (opts.okOnly ? $("#modal-confirm") : $("#modal-cancel")).focus(), 0);
      const done = (answer) => {
        const checks = {};
        $("#modal-extra").querySelectorAll("input[type=checkbox]")
          .forEach((cb) => { checks[cb.id] = cb.checked; });
        backdrop.classList.remove("open");
        document.removeEventListener("keydown", onKey);
        $("#modal-extra").innerHTML = "";
        $("#modal-confirm").onclick = $("#modal-cancel").onclick = backdrop.onclick = null;
        if (opener && opener.focus) opener.focus();
        resolve(opts.extraHtml ? { confirmed: answer, checks } : answer);
      };
      $("#modal-confirm").onclick = () => done(true);
      $("#modal-cancel").onclick = () => done(false);
      backdrop.onclick = (e) => { if (e.target === backdrop) done(false); };
    });
    const shown = modalChain.then(show);
    modalChain = shown.catch(() => {});
    return shown;
  }

  const notice = (title, text) => confirmModal(title, text, { okOnly: true, okText: "OK" });

  // --- signing in --------------------------------------------------------------

  function showLogin(show) {
    $("#view-login").style.display = show ? "" : "none";
    $("#view-dashboard").style.display = show ? "none" : "";
    $("#view-settings").style.display = "none";
    for (const id of ["search", "settings-btn", "refresh"])
      document.getElementById(id).style.display = show ? "none" : "";
    if (show) setTimeout(() => $("#l-user").focus(), 50);
  }

  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#l-submit");
    btn.disabled = true;
    $("#login-msg").textContent = "";
    try {
      await api("/api/login", {
        method: "POST", expectSignedOut: true,
        body: { username: $("#l-user").value.trim(), password: $("#l-pass").value },
      });
      $("#l-pass").value = "";
      showLogin(false);
      loadUiConfig();
      refresh();
      loadUpdates();
    } catch (err) {
      $("#login-msg").textContent = err.message;
    }
    btn.disabled = false;
  });

  // --- loading -----------------------------------------------------------------

  async function refresh() {
    $("#status-stacks").textContent = "Loading stacks from all instances…";
    $("#refresh").disabled = true;
    try {
      data = await api("/api/stacks");
      // Fresh state on screen: results left on rows by earlier actions have had their say.
      for (const [key, op] of ops) if (op.phase === "settled") ops.delete(key);
      loadUpdates();  // the cached result — cheap, and a scheduled check may have run
      const total = data.reduce((n, i) => n + i.stacks.length, 0);
      const down = data.filter((i) => !i.reachable).length;
      $("#status-stacks").textContent = data.length === 0
        ? "No Portainer instances configured — click “⚙ Instances” to add your servers."
        : `${total} stacks across ${plural(data.length, "instance")}` +
          (down ? ` — ${plural(down, "instance")} unreachable` : "") +
          ` · updated ${new Date().toLocaleTimeString()}`;
      render();
    } catch (err) {
      if (err.status !== 401) $("#status-stacks").textContent = "Failed to load: " + err.message;
    } finally {
      $("#refresh").disabled = false;
      scheduleRefresh();
    }
  }

  function renderCheckStatus() {
    $("#status-updates").textContent = updates.checking
      ? "· checking registries…"
      : updates.checkedAt
        ? `· updates checked ${ago(updates.checkedAt)}`
        : "· updates not checked yet — click “Refresh”";
  }

  async function loadUpdates() {
    try {
      updates = await api("/api/updates");
      render();
      renderCheckStatus();
    } catch (err) { /* update info is optional; dashboard works without it */ }
  }

  let checking = false;
  async function backgroundCheck() {
    // Fired by Refresh: scans registries without blocking the stack reload.
    if (checking) return;
    checking = true;
    $("#status-updates").textContent = "· checking registries…";
    try {
      updates = await api("/api/check-updates", { method: "POST" });
      render();
      renderCheckStatus();
    } catch (err) {
      $("#status-updates").textContent = "· registry check failed";
    } finally {
      checking = false;
    }
  }

  let refreshBase = 0;    // seconds between refreshes (0 = auto-refresh off)
  let retryDelay = null;  // set while something is unreachable: retry sooner
  let refreshTimer = null;
  let jobWaitSeconds = 40 * 60;  // how long to keep asking about a job; the server says

  // An instance that's unreachable is usually mid-reboot, so re-check in
  // seconds rather than waiting out the full interval, backing off until it
  // returns. Otherwise a machine that came back stays greyed out for minutes.
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    if (!refreshBase) return;
    if (data.some((i) => !i.reachable)) {
      // Cap at 30s: something that just came back shouldn't sit greyed out for
      // minutes because the backoff had grown to the full interval.
      retryDelay = Math.min(retryDelay ? retryDelay * 2 : 10, 30, refreshBase);
    } else {
      retryDelay = null;
    }
    refreshTimer = setTimeout(autoTick, (retryDelay || refreshBase) * 1000);
  }

  function autoTick() {
    const loginVisible = $("#view-login").style.display !== "none";
    // Not while something is being updated or cleaned: half-way states would
    // flash past as "down".
    if (loginVisible || anyBusy() || document.hidden) { scheduleRefresh(); return; }
    refresh();  // reschedules itself when it finishes
  }

  // --- actions -----------------------------------------------------------------

  async function runUpdate(entry) {
    const key = entry.key;
    const op = setOp(key, { action: "update", phase: "busy", label: "Updating…", message: "" });
    const finish = (ok, message) => {
      Object.assign(op, { phase: ok ? "ok" : "err", ok, message });
      render();
      settleLater(key, op);
      return ok;
    };
    try {
      let result = await api(`${entry.path}/update${entry.query}`, { method: "POST" });
      // Still deploying: the server keeps watching it; we keep asking.
      if (result.jobId && result.ok == null) result = await waitForJob(result.jobId);
      if (!result.ok) return finish(false, result.message || "Failed");
      // The server has already cleared this row's badge in its cached check.
      await loadUpdates();
      return finish(true, `${((result.durationMs || 0) / 1000).toFixed(1)}s · ${result.message || "done"}`);
    } catch (err) {
      if (err instanceof TypeError) {
        // The connection to Restruo died mid-update — the usual cause is
        // Restruo redeploying itself. Wait for it to come back, then reload.
        Object.assign(op, {
          label: "Reconnecting…",
          message: "Connection lost — if this was Restruo itself, it's restarting. Waiting for it to come back…",
        });
        render();
        if (await waitForBackend(180)) { location.reload(); return true; }
      }
      return finish(false, err.message);
    }
  }

  async function waitForJob(jobId) {
    // Wait longer than any job can take; past that, say tracking was lost
    // rather than call it failed. A brief network blip is not a failure —
    // keep asking.
    const deadline = Date.now() + jobWaitSeconds * 1000;
    while (Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 2000));
      try {
        const job = await api(`/api/jobs/${jobId}`);
        if (job.done) return job.result || { ok: false, message: "No result recorded." };
      } catch (err) {
        if (err instanceof ApiError)
          return { ok: false, message: err.status === 401 ? "Signed out." : err.message };
        /* transient — try again */
      }
    }
    return { ok: false, message: `Lost track of this update after ${Math.round(jobWaitSeconds / 60)} minutes — it was not seen to fail; check the stack in Portainer.` };
  }

  async function waitForBackend(seconds) {
    const deadline = Date.now() + seconds * 1000;
    while (Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 3000));
      try {
        const res = await fetch("/healthz", { cache: "no-store" });
        if (res.ok) return true;
      } catch (err) { /* still down — keep waiting */ }
    }
    return false;
  }

  async function runPower(entry, verb) {
    const key = entry.key;
    const op = setOp(key, { action: "power", verb, phase: "busy", message: "" });
    try {
      await api(`${entry.path}/${verb}${entry.query}`, { method: "POST" });
      op.phase = "ok";
      render();
      // Re-read real state so the button flips and the red dot follows.
      setTimeout(() => { if (ops.get(key) === op) ops.delete(key); refresh(); }, 1500);
    } catch (err) {
      Object.assign(op, { phase: "err", ok: false, message: err.message });
      render();
      settleLater(key, op);
    }
  }

  async function runCleanup(inst) {
    const iid = inst.instance.id;
    const name = inst.instance.name;
    // Stopping a stack removes its containers, so its images look unused.
    // Name them, because "all unused images" would delete exactly those.
    const stopped = (inst.stacks || []).filter((s) => s.stopped).map((s) => s.name);
    const stoppedWarning = stopped.length
      ? `<div class="chk"><span class="danger">⚠ ${plural(stopped.length, "stopped stack")} on this instance (${esc(stopped.join(", "))}). Stopping a stack removes its containers, so its images and volumes look unused — the two ticked-off options below would delete them.</span></div>`
      : "";
    const answer = await confirmModal(`Clean up “${name}”?`,
      "Removes Docker leftovers. Running stacks and containers are never touched.",
      { okText: "Clean up", extraHtml: `
      <label class="chk"><input type="checkbox" id="cl-images" checked>
        <span>Leftover images — the old versions left behind by updates</span></label>
      <label class="chk"><input type="checkbox" id="cl-networks" checked>
        <span>Networks that no container uses — a stopped container's network is kept</span></label>
      ${stoppedWarning}
      <label class="chk"><input type="checkbox" id="cl-all-images">
        <span>Also every image no container uses — <span class="danger">includes stopped stacks</span>, which then need a re-pull before they can start</span></label>
      <label class="chk"><input type="checkbox" id="cl-volumes">
        <span>Unused volumes — <span class="danger">permanently deletes the data</span> in them, stopped stacks included</span></label>` });
    const opts = answer.confirmed && {
      images: answer.checks["cl-images"] || answer.checks["cl-all-images"],
      allImages: answer.checks["cl-all-images"],
      networks: answer.checks["cl-networks"],
      volumes: answer.checks["cl-volumes"],
    };
    if (!opts || (!opts.images && !opts.networks && !opts.volumes)) return;

    setOp(`${iid}:prune`, { action: "prune", phase: "busy" });
    let title;
    let summary;
    try {
      const done = await api(`/api/instances/${iid}/prune`, { method: "POST", body: opts });
      const parts = [];
      if (opts.images) parts.push(plural(done.images, "image"));
      if (opts.networks) parts.push(plural(done.networks, "network"));
      if (opts.volumes) parts.push(plural(done.volumes, "volume"));
      title = done.ok ? `Cleanup finished — ${name}` : `Cleanup finished with errors — ${name}`;
      summary = `Freed ${fmtBytes(done.spaceReclaimed)} — removed ${parts.join(", ")}.` +
        (done.errors.length ? `\n\nProblems: ${done.errors.join("; ")}` : "");
    } catch (err) {
      title = `Cleanup failed — ${name}`;
      summary = err.message;
    }
    // Restore the button as soon as the work is done: the result dialog may sit
    // in the queue behind another instance's, and a spinner waiting on someone
    // else's dialog looks like a hang.
    ops.delete(`${iid}:prune`);
    render();
    await notice(title, summary);
  }

  async function confirmUpdate(entry) {
    const r = entry.row;
    const isContainer = entry.kind === "container";
    // Which of these applies is the server's call (app/dashboard.py); the
    // page only words it.
    let text = isContainer
      ? "This pulls the image fresh and recreates the container with its existing configuration."
      : "This repulls the image(s) and redeploys the stack. Containers will restart.";
    if (r.isSelf)
      text += " This looks like Restruo itself — the page will disconnect while it restarts, then reload automatically.";
    if (r.stopped)
      text = isContainer
        ? "This container is stopped. It is recreated on the freshly pulled image and then stopped again — Portainer's recreate starts it, so it runs for a moment."
        : "This stack is stopped, and it stays stopped: its images are pulled so that it starts on the new version next time. Nothing is started.";
    if (r.helper === "agent")
      text = "Portainer can't recreate its own agent — the command travels through it. " +
        "Restruo starts a short-lived helper on that host instead: it pulls the new image first, " +
        "swaps the container keeping its ports, mounts and settings, and puts the old one back if the new one doesn't stay up. " +
        "The environment is unreachable for about twenty seconds while it happens.";
    if (r.helper === "portainer")
      text = "This replaces Portainer itself, using a short-lived helper on its host: it pulls the new image first, " +
        "swaps the container keeping its ports, mounts and settings, and puts the old one back if the new one doesn't start. " +
        "A new Portainer version upgrades its database on first start, and that cannot be undone by going back to the old image — " +
        "take a backup first (Portainer → Settings → Backup). This instance is unreachable for a minute or so while it happens.";
    if (await confirmModal(`Update “${entry.name}”?`, text)) runUpdate(entry);
  }

  async function confirmPower(entry, verb) {
    if (verb === "stop") {
      const yes = await confirmModal(`Stop “${entry.name}”?`,
        "Its containers will shut down and stay down until you start them again.",
        { okText: "Stop" });
      if (!yes) return;
    }
    runPower(entry, verb);  // starting is harmless — no confirmation
  }

  async function updateAll(inst) {
    const iid = inst.instance.id;
    if (!updates.checkedAt) {
      await notice("No update check yet",
        "Hit “Refresh” first so the registries get scanned — “Update all” only redeploys stacks and containers that actually have an update available.");
      return;
    }
    // What is on screen with an update waiting — so a filter narrows it — and
    // that the server will take. Portainer itself is never part of a bulk
    // update: its database upgrade is one-way, so it gets its own click and
    // its own warning.
    const filter = currentFilter();
    const flagged = entriesOf(inst).filter((e) =>
      e.updates && matches(e, filter) && !isBusy(e.key) &&
      !e.row.updateProtected && e.row.helper !== "portainer");
    if (!flagged.length) {
      await notice("All up to date", `Nothing on “${inst.instance.name}” has an update available.`);
      return;
    }
    const yes = await confirmModal(
      `Update ${flagged.length} on “${inst.instance.name}”?`,
      `Only the ${plural(flagged.length, "item")} with an update available will be repulled and redeployed. ` +
      `A redeploy takes about a minute each; ${UPDATE_ALL_CONCURRENCY} run at a time.`);
    if (!yes) return;
    setOp(`${iid}:all`, { action: "all", phase: "busy" });
    // Portainer deploys different stacks concurrently without conflict, and
    // each redeploy takes about a minute — sequentially, twenty stacks is
    // twenty minutes. Capped so a NAS isn't asked to pull everything at once.
    const runPool = async (entries) => {
      const queue = [...entries];
      await Promise.all(
        Array.from({ length: Math.min(UPDATE_ALL_CONCURRENCY, queue.length) }, async () => {
          while (queue.length) await runUpdate(queue.shift());
        })
      );
    };
    // Agents go last, once nothing is deploying any more: every stack on an
    // environment is deployed THROUGH its agent, so replacing the agent
    // mid-deploy would cut that deploy off.
    await runPool(flagged.filter((e) => e.row.helper !== "agent"));
    await runPool(flagged.filter((e) => e.row.helper === "agent"));
    ops.delete(`${iid}:all`);
    render();
  }

  document.addEventListener("click", async (e) => {
    const unkBadge = e.target.closest(".badge.unk, .img-line.unk");
    if (unkBadge && unkBadge.title) {
      e.stopPropagation();  // don't collapse the instance we're inspecting
      await notice("Couldn't check these for updates", unkBadge.title);
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    if (act === "cleanup" || act === "update-all") {
      const inst = data.find((i) => i.instance.id === Number(btn.dataset.iid));
      if (inst) (act === "cleanup" ? runCleanup : updateAll)(inst);
      return;
    }
    const entry = findEntry(btn.dataset.key);
    if (!entry) return;
    if (act === "update") confirmUpdate(entry);
    else confirmPower(entry, act);
  });

  // --- instance settings ---
  let editingId = null;

  function showSettings(show) {
    $("#view-settings").style.display = show ? "" : "none";
    $("#view-dashboard").style.display = show ? "none" : "";
    if (show) loadInstances();
    else { refresh(); loadUpdates(); }
  }

  function authTypeSelected() {
    return $("#f-auth-cred").checked ? "credentials" : "api_key";
  }

  function syncAuthFields() {
    const cred = authTypeSelected() === "credentials";
    $("#auth-key-fields").style.display = cred ? "none" : "";
    $("#auth-cred-fields").style.display = cred ? "" : "none";
  }

  function fillForm(rec) {
    editingId = rec ? rec.id : null;
    $("#form-title").textContent = rec ? `Edit “${rec.name}”` : "Add an instance";
    $("#f-save").textContent = rec ? "Save changes" : "Add instance";
    $("#f-cancel").style.display = rec ? "" : "none";
    $("#f-name").value = rec ? rec.name : "";
    $("#f-url").value = rec ? rec.baseUrl : "";
    $("#f-verify").checked = rec ? rec.verifyTls : true;
    ($("#f-auth-" + (rec && rec.authType === "credentials" ? "cred" : "key"))).checked = true;
    $("#f-apikey").value = "";
    $("#f-username").value = rec && rec.username ? rec.username : "";
    $("#f-password").value = "";
    const secretHint = rec ? "(leave blank to keep current)" : "";
    $("#apikey-hint").textContent = secretHint;
    $("#password-hint").textContent = secretHint;
    $("#form-msg").textContent = "";
    $("#form-msg").className = "";
    syncAuthFields();
  }

  function formBody() {
    return {
      name: $("#f-name").value.trim(),
      baseUrl: $("#f-url").value.trim(),
      verifyTls: $("#f-verify").checked,
      authType: authTypeSelected(),
      apiKey: $("#f-apikey").value || null,
      username: $("#f-username").value.trim() || null,
      password: $("#f-password").value || null,
    };
  }

  function formMsg(text, ok) {
    $("#form-msg").textContent = text;
    $("#form-msg").className = ok ? "ok" : "err";
  }

  async function loadInstances() {
    const list = $("#inst-list");
    try {
      const insts = await api("/api/instances");
      if (!insts.length) {
        list.innerHTML = '<p class="count">No instances yet — add your first Portainer below.</p>';
        return;
      }
      // This order is the dashboard's order.
      list.innerHTML = insts.map((i, n) => `
        <div class="inst-row">
          <span class="inst-order">
            <button class="inst-move" data-id="${i.id}" data-dir="up"
              ${n === 0 ? "disabled" : ""} title="Move up" aria-label="Move up">▲</button>
            <button class="inst-move" data-id="${i.id}" data-dir="down"
              ${n === insts.length - 1 ? "disabled" : ""} title="Move down" aria-label="Move down">▼</button>
          </span>
          <span class="inst-name">${esc(i.name)}</span>
          <span class="type-tag">${i.authType === "credentials" ? "user/pass" : "API token"}</span>
          ${i.reachable ? '<span class="badge ok">● reachable</span>'
            : `<span class="badge err" title="${esc(i.error)}">● unreachable</span>`}
          <span class="inst-url">${esc(i.baseUrl)}${i.verifyTls ? "" : " · TLS not verified"}</span>
          <button class="inst-edit" data-id="${i.id}">Edit</button>
          <button class="inst-del" data-id="${i.id}" data-name="${esc(i.name)}">Delete</button>
        </div>`).join("");
      list.querySelectorAll(".inst-move").forEach((btn) =>
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await api(`/api/instances/${btn.dataset.id}/move`,
              { method: "POST", body: { direction: btn.dataset.dir } });
          } catch (err) { alert(`Could not reorder: ${err.message}`); }
          loadInstances();
        }));
      list.querySelectorAll(".inst-edit").forEach((btn) =>
        btn.addEventListener("click", () =>
          fillForm(insts.find((i) => i.id === Number(btn.dataset.id)))));
      list.querySelectorAll(".inst-del").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const yes = await confirmModal(`Delete “${btn.dataset.name}”?`,
            "Restruo will forget this Portainer instance and its credentials. Nothing on the machine itself is touched.");
          if (!yes) return;
          try {
            await api(`/api/instances/${btn.dataset.id}`, { method: "DELETE" });
            if (editingId === Number(btn.dataset.id)) fillForm(null);
          } catch (err) { alert(`Could not remove it: ${err.message}`); }
          loadInstances();
        }));
    } catch (err) {
      if (err.status !== 401) list.innerHTML = `<p class="count">Failed to load: ${esc(err.message)}</p>`;
    }
  }

  $("#inst-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const saveBtn = $("#f-save");
    saveBtn.disabled = true;
    try {
      const wasAdd = editingId === null;
      await api(wasAdd ? "/api/instances" : `/api/instances/${editingId}`,
        { method: wasAdd ? "POST" : "PUT", body: formBody() });
      fillForm(null);
      formMsg(wasAdd ? "Instance added." : "Saved.", true);
      loadInstances();
      // Cover the new/changed instance right away instead of waiting for the
      // next scheduled registry check.
      api("/api/check-updates", { method: "POST" }).then(() => loadUpdates()).catch(() => {});
    } catch (err) {
      formMsg(err.message, false);
    } finally {
      saveBtn.disabled = false;
    }
  });

  $("#f-test").addEventListener("click", async () => {
    const btn = $("#f-test");
    btn.disabled = true;
    btn.innerHTML = SPINNER + "Testing…";
    try {
      const qs = editingId === null ? "" : `?id=${editingId}`;
      const tested = await api(`/api/instances/test${qs}`, { method: "POST", body: formBody() });
      if (tested.ok) formMsg(`✅ Connected — ${plural(tested.endpoints, "environment")} found.`, true);
      else formMsg(`❌ ${tested.error || "Connection failed"}`, false);
    } catch (err) {
      formMsg(`❌ ${err.message}`, false);
    }
    btn.disabled = false;
    btn.textContent = "Test connection";
  });

  document.querySelectorAll('input[name="authType"]').forEach((radio) =>
    radio.addEventListener("change", syncAuthFields));
  $("#f-cancel").addEventListener("click", () => fillForm(null));
  $("#settings-btn").addEventListener("click", () => showSettings(true));
  $("#email-test").addEventListener("click", async () => {
    const btn = $("#email-test");
    const msg = $("#email-msg");
    btn.disabled = true;
    btn.innerHTML = SPINNER + "Sending…";
    msg.textContent = "";
    try {
      const sent = await api("/api/test-email", { method: "POST" });
      msg.textContent = `Sent to ${sent.sentTo.join(", ")} — check your inbox.`;
      msg.className = "ok";
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "err";
    }
    btn.disabled = false;
    btn.textContent = "Send test email";
  });

  $("#settings-close").addEventListener("click", () => showSettings(false));
  $("#home").addEventListener("click", () => {
    if ($("#view-login").style.display !== "none") return;  // not signed in yet
    showSettings(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#signout-btn").addEventListener("click", async () => {
    try {
      await api("/api/logout", { method: "POST", expectSignedOut: true });
    } catch (err) {
      // Already signed out, or already unreachable: nothing to keep.
      if (err instanceof ApiError && err.status !== 401) {
        alert(`Sign-out failed (${err.message}) — the session may still be valid.`);
        return;
      }
    }
    data = []; updates = { checkedAt: null, instances: [] };
    ops.clear();
    render();
    showLogin(true);
  });

  $("#refresh").addEventListener("click", () => { refresh(); backgroundCheck(); });
  $("#search").addEventListener("input", render);

  function loadUiConfig() {
    api("/api/ui-config").then((cfg) => {
      if (cfg.authEnabled) $("#signout-btn").style.display = "";
      if (cfg.jobWaitSeconds > 0) jobWaitSeconds = cfg.jobWaitSeconds;
      if (cfg.refreshSeconds > 0) {
        refreshBase = cfg.refreshSeconds;
        scheduleRefresh();
      }
      if (cfg.title) {
        document.title = cfg.title;
        $("#login-title").textContent = cfg.title;
        $("#title").innerHTML = `${esc(cfg.title)} <span>Portainer stack updater</span>`;
      }
      if (cfg.email) {
        $("#email-panel").style.display = "";
        $("#email-status").textContent = cfg.email.configured
          ? `Emailing new updates to ${cfg.email.recipients.join(", ")} via ${cfg.email.host}.`
          : "Not configured — set RESTRUO_SMTP_USER and RESTRUO_SMTP_PASSWORD to get an email when an update appears.";
        $("#email-test").disabled = !cfg.email.configured;
      }
      // The running build lives on the settings page, out of the way.
      if (cfg.version) {
        const ver = cfg.version === "dev" ? "dev" : cfg.version.slice(0, 7);
        $("#build-line").textContent = `build ${ver}`;
        $("#build-line").title = cfg.version;
      }
    }).catch(() => {});
  }
  loadUiConfig();

  // Coming back to an open tab/PWA refreshes immediately.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) autoTick();
  });

  refresh();
  loadUpdates();
})();
</script>
</body>
</html>
